<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NHC Lifer | Not HermitCraft SMP</title>
<meta name="description" content="Discover NHC Lifer: Boogie, Hunger Games, Soulbound and Expanding Horizons. Explore the game modes, player rules and in-game menu.">
<link rel="icon" type="image/png" href="../media/favicon.png">
<link rel="stylesheet" href="../media/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
.lifer {padding:6rem 1.5rem 3rem;line-height:1.7;max-width:1080px;margin:auto}
.lifer * {box-sizing:border-box}
.lifer a {color:var(--accent1)}
.lifer a:focus-visible,.lifer summary:focus-visible {outline:2px solid var(--accent1);outline-offset:5px}
.lifer .hero {margin:2rem 0 3rem;padding:3rem;border:1px solid #444;border-radius:var(--roundness);background:linear-gradient(90deg,#16191bf5,#16191b99),url('../gallery/images/season 4/Life_Series_Sky_Bridge.png') center/cover}
.lifer .eyebrow {color:var(--accent1);letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.lifer h1 {font-size:clamp(3rem,8vw,5rem);line-height:1.1;margin:.6rem 0 1rem}
.lifer .intro {font-size:clamp(1.25rem,3vw,1.8rem);max-width:700px;line-height:1.4}
.lifer p {color:#ddd;max-width:780px}
.lifer .topics {display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.8rem}
.lifer .topics a {padding:.6rem 1rem;border:1px solid var(--accent2);border-radius:var(--roundness);text-decoration:none;background:#16191b}
.lifer .topics a:hover {background:var(--accent2_transp)}
.lifer h2 {font-size:2rem;line-height:1.25;margin:0 0 1rem}
.lifer h3 {font-size:1.15rem;color:var(--accent1);margin:0 0 .5rem}
.lifer section {scroll-margin-top:2rem;margin-bottom:3rem}
.lifer .grid {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.lifer .panel {background:linear-gradient(145deg,#2d2d2d,#1a1a1a);border:1px solid #444;border-radius:var(--roundness);padding:1.5rem;box-shadow:0 8px 25px #0003}
.lifer .panel p {margin:.4rem 0 0}
.lifer .command {display:inline-block;background:var(--background2);border:1px solid var(--accent2);padding:.5rem 1rem;border-radius:.5rem;font-size:1.35rem;color:var(--accent1);overflow-wrap:anywhere}
.lifer .mode {border-top:1px solid #444;padding-top:2.5rem}
.lifer .tagline {font-size:1.3rem;margin:.25rem 0}
.lifer .badges {display:flex;flex-wrap:wrap;gap:.5rem;margin:1.5rem 0}
.lifer .badge {border:1px solid #555;border-radius:2rem;padding:.25rem .8rem;color:#ddd;font-size:.85rem}
.lifer details {margin:1rem 0;background:var(--background2);border:1px solid #444;border-radius:var(--roundness)}
.lifer summary {padding:1.15rem 1.5rem;color:var(--accent1);font-size:1.15rem;cursor:pointer}
.lifer details[open] summary {border-bottom:1px solid #444}
.lifer ul {padding:0 1.5rem 1rem 2.8rem;color:#ddd}
.lifer li {padding-left:.3rem;margin:1rem 0}
.lifer .closing {text-align:center;font-size:1.4rem;color:var(--accent1);margin:3rem auto}
.lifer [hidden] {display:none!important}
@media(max-width:650px){.lifer{padding:6rem 1rem 2rem}.lifer .hero{padding:1.5rem}.lifer .grid{grid-template-columns:1fr}.lifer h2{font-size:1.7rem}.lifer summary{padding:1rem}.lifer ul{padding-right:1rem}}
</style>
</head>
<body>
<div id="desktop-nav-container"></div>
<div id="mobile-nav-container"></div>
<main class="lifer">
<div id="content" aria-busy="true"><p role="status">Loading NHC Lifer…</p></div>
<p id="error" role="alert" hidden>We couldn’t load the player guide. Please refresh the page and try again. In game, use /NHCLife to read Rules and status.</p>
<noscript><p>This guide needs JavaScript to load its content. In game, type /NHCLife and select Rules and status.</p></noscript>
</main>
<footer class="copyright_div"><a href="https://github.com/FQQD/MCServer-Web-Template" class="copyright">Made by FQQD 2023 - Edited by Dakota - HeruEdhel 2025</a></footer>
<script src="../media/navigation.js"></script>
<script>
'use strict';
// Recognize this unlisted subpage locally without changing shared navigation.
NavigationManager.prototype.detectCurrentPage = function () { return 'lifer'; };
const el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!==undefined)node.textContent=text;if(cls)node.className=cls;return node;};
function cards(items){const grid=el('div',undefined,'grid');for(const item of items){const card=el('article',undefined,'panel');card.append(el('h3',item.title),el('p',item.text));grid.append(card);}return grid;}
async function loadGuide(){
 const content=document.getElementById('content');
 try {
  const response=await fetch('./lifer.json');if(!response.ok)throw new Error('Guide unavailable');const data=await response.json();
  const fragment=document.createDocumentFragment();
  const hero=el('header',undefined,'hero');hero.append(el('p',data.eyebrow,'eyebrow'),el('h1',data.title),el('p',data.intro,'intro'),el('p',data.description));
  const topics=el('nav',undefined,'topics');topics.setAttribute('aria-label','Player guide sections');
  for(const item of [...data.modes,{id:'not-hermits',title:'Make the mayhem'},{id:'player-menu',title:'In-game menu'},{id:'before-you-play',title:'Before you play'}]){const link=el('a',item.title);link.href='#'+item.id;topics.append(link);}hero.append(topics);fragment.append(hero);
  const join=el('section',undefined,'panel');const joinTitle=el('h2',data.join.title);joinTitle.id='join-games-title';join.setAttribute('aria-labelledby',joinTitle.id);join.append(joinTitle,el('code',data.join.command,'command'),el('p',data.join.description));fragment.append(join);
  const community=el('section');community.id='not-hermits';const communityTitle=el('h2',data.community.title);communityTitle.id='community-title';community.setAttribute('aria-labelledby',communityTitle.id);community.append(communityTitle,el('p',data.community.description),cards(data.community.items));fragment.append(community);
  const menu=el('section');menu.id='player-menu';const menuTitle=el('h2',data.menu.title);menuTitle.id='menu-title';menu.setAttribute('aria-labelledby',menuTitle.id);menu.append(menuTitle,el('code',data.menu.command,'command'),el('p',data.menu.description),cards(data.menu.items));fragment.append(menu);
  for(const mode of data.modes){const section=el('section',undefined,'mode');section.id=mode.id;const title=el('h2',mode.title);title.id=mode.id+'-title';section.setAttribute('aria-labelledby',title.id);section.append(title,el('p',mode.tagline,'tagline'),el('p',mode.description));const badges=el('div',undefined,'badges');for(const text of mode.highlights)badges.append(el('span',text,'badge'));section.append(badges);
   for(const rules of mode.sections){const details=el('details');details.open=false;const list=el('ul');for(const text of rules.items)list.append(el('li',text));details.append(el('summary',rules.title),list);section.append(details);}fragment.append(section);
  }
  const essentials=el('section');essentials.id='before-you-play';const title=el('h2',data.essentials.title);title.id='essentials-title';essentials.setAttribute('aria-labelledby',title.id);essentials.append(title,cards(data.essentials.items));fragment.append(essentials,el('p',data.closing,'closing'));
  content.replaceChildren(fragment);
 }catch(error){content.replaceChildren();document.getElementById('error').hidden=false;}
 finally{content.setAttribute('aria-busy','false');}
}
loadGuide();
</script>
</body>
</html>
