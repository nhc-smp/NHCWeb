<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not HermitCraft SMP</title>
    <link rel="icon" type="image/png" href="../media/favicon.png">
    <link rel="stylesheet" href="../media/style.css">
    <link href="https://fonts.bunny.net/css?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="../media/navigation.js"></script>
    
    <!-- Navigation containers - content will be dynamically generated -->
    <div id="desktop-nav-container"></div>
    <div id="mobile-nav-container"></div>
    <!-- Gallery Header -->
    <div class="gallery-header">
        <h1 class="gallery-title">Server Gallery</h1>
        <p class="gallery-subtitle">Explore screenshots from our Minecraft server</p>
    </div>

    <!-- Main Gallery Container -->
    <div class="gallery-main">
        <!-- Main Image Display -->
        <div class="gallery-viewer">
            <div class="gallery-image-container">
                <img id="gallery-image" src="images/season 4/spawn.jpg" alt="Server Screenshot" class="gallery-main-image">
                <div class="gallery-loading" id="gallery-loading">Loading...</div>
                
                <!-- Navigation Arrows -->
                <button class="gallery-nav gallery-nav-prev" onclick="prevImage()" aria-label="Previous Image">
                    <i class="fa fa-chevron-left"></i>
                </button>
                <button class="gallery-nav gallery-nav-next" onclick="nextImage()" aria-label="Next Image">
                    <i class="fa fa-chevron-right"></i>
                </button>
                
                <!-- Image Counter -->
                <div class="gallery-counter">
                    <span id="current-index">1</span> / <span id="total-images">4</span>
                </div>
            </div>
            
            <!-- Image Info -->
            <div class="gallery-info">
                <h3 id="image-title" class="gallery-image-title">Hogwarts Castle</h3>
                <p id="image-description" class="gallery-image-description">Our magnificent Hogwarts castle build</p>
            </div>
        </div>

        <!-- Gallery Controls -->
        <div class="gallery-controls">
            <div class="gallery-season-picker">
                <label class="gallery-season-label" for="season-select">Season</label>
                <select id="season-select" class="gallery-select" aria-label="Select season" onchange="handleSeasonChange(this.value)"></select>
            </div>
            <div class="gallery-season-picker">
                <label class="gallery-season-label" for="tag-select">Tag</label>
                <select id="tag-select" class="gallery-select" aria-label="Select tag" onchange="handleTagChange(this.value)"></select>
            </div>
            <button class="gallery-btn" onclick="pauseGallery()" id="pause-btn">
                <i class="fa fa-pause"></i> Pause
            </button>
            <button class="gallery-btn" onclick="toggleFullscreen()">
                <i class="fa fa-expand"></i> Fullscreen
            </button>
            <button class="gallery-btn" onclick="downloadImage()">
                <i class="fa fa-download"></i> Download
            </button>
        </div>

        <!-- Thumbnails -->
        <div class="gallery-thumbnails">
            <h4 class="thumbnails-title">Images</h4>
            <div class="thumbnails-grid" id="thumbnails-container">
                <!-- Thumbnails will be generated here -->
            </div>
        </div>
    </div>

    <script>
        // Season data is loaded from ../data/gallerySeasons.json
        let gallerySeasons = {};

        const galleryConfig = {
            path: '',
            autoRotateSpeed: 6000, // 6 seconds (slower for more images)
            images: []
        };

        let currentIndex = 0;
        let isPaused = false;
        let autoRotateInterval = null;
        let isFullscreen = false;
        let currentSeasonKey = null;
        let currentTag = 'all';
        let seasonAllImages = [];

        async function loadGallerySeasons() {
            const response = await fetch('../data/gallerySeasons.json', { cache: 'no-store' });
            if (!response.ok) {
                throw new Error(`Failed to load gallery seasons: ${response.status} ${response.statusText}`);
            }
            const data = await response.json();

            if (!data || typeof data !== 'object') {
                throw new Error('Gallery seasons data is not an object');
            }

            const seasonKeys = Object.keys(data);
            if (seasonKeys.length === 0) {
                throw new Error('Gallery seasons JSON has no seasons');
            }

            gallerySeasons = data;
        }

        function buildImageUrl(file) {
            return `${encodeURI(galleryConfig.path)}${encodeURIComponent(file)}`;
        }

        function getImageTags(image) {
            if (!image || !Array.isArray(image.tags)) return [];
            return image.tags.filter(t => typeof t === 'string' && t.trim().length > 0);
        }

        function collectSeasonTags(images) {
            const tagSet = new Set();
            images.forEach(img => {
                getImageTags(img).forEach(t => tagSet.add(t));
            });
            return Array.from(tagSet).sort((a, b) => a.localeCompare(b));
        }

        function initTagSelector(tags) {
            const select = document.getElementById('tag-select');
            if (!select) return;
            select.innerHTML = '';

            const allOption = document.createElement('option');
            allOption.value = 'all';
            allOption.textContent = 'All';
            select.appendChild(allOption);

            tags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                option.textContent = tag;
                select.appendChild(option);
            });
        }

        function getInitialTag() {
            const params = new URLSearchParams(window.location.search);
            const tag = String(params.get('tag') || '').trim();
            return tag || 'all';
        }

        function applyFilters({ pushHistory = true } = {}) {
            const filtered = (currentTag === 'all')
                ? seasonAllImages
                : seasonAllImages.filter(img => getImageTags(img).includes(currentTag));

            galleryConfig.images = filtered;
            currentIndex = 0;

            const total = filtered.length;
            document.getElementById('total-images').textContent = total;
            document.getElementById('current-index').textContent = total > 0 ? 1 : 0;

            const prevBtn = document.querySelector('.gallery-nav-prev');
            const nextBtn = document.querySelector('.gallery-nav-next');
            if (prevBtn) prevBtn.disabled = total === 0;
            if (nextBtn) nextBtn.disabled = total === 0;

            createThumbnails();
            updateDisplay();

            const tagSelect = document.getElementById('tag-select');
            if (tagSelect) tagSelect.value = currentTag;

            if (pushHistory) {
                const url = new URL(window.location.href);
                url.searchParams.set('season', currentSeasonKey);
                if (currentTag && currentTag !== 'all') {
                    url.searchParams.set('tag', currentTag);
                } else {
                    url.searchParams.delete('tag');
                }
                window.history.replaceState({}, '', url);
            }
        }

        function normalizeSeasonKey(value) {
            const trimmed = String(value || '').trim().toLowerCase();
            if (!trimmed) return null;
            if (trimmed === '4' || trimmed === 'season4' || trimmed === 'season-4') return 'season-4';
            return trimmed;
        }

        function getInitialSeasonKey() {
            const params = new URLSearchParams(window.location.search);
            const fromQuery = normalizeSeasonKey(params.get('season'));
            if (fromQuery && gallerySeasons[fromQuery]) return fromQuery;
            return Object.keys(gallerySeasons)[0];
        }

        function initSeasonSelector() {
            const select = document.getElementById('season-select');
            if (!select) return;
            select.innerHTML = '';

            Object.entries(gallerySeasons).forEach(([key, season]) => {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = season.label;
                select.appendChild(option);
            });
        }

        function setSeason(seasonKey, { pushHistory = true } = {}) {
            if (!gallerySeasons[seasonKey]) return;

            stopAutoRotate();
            currentSeasonKey = seasonKey;
            currentIndex = 0;

            galleryConfig.path = gallerySeasons[seasonKey].path;
            seasonAllImages = Array.isArray(gallerySeasons[seasonKey].images) ? gallerySeasons[seasonKey].images : [];

            const tags = collectSeasonTags(seasonAllImages);
            initTagSelector(tags);

            // Preserve the current tag if it exists for this season; otherwise reset to 'all'
            if (currentTag !== 'all' && !tags.includes(currentTag)) {
                currentTag = 'all';
            }

            applyFilters({ pushHistory });
            if (!isPaused) startAutoRotate();

            const select = document.getElementById('season-select');
            if (select) select.value = seasonKey;

        }

        function handleSeasonChange(seasonKey) {
            setSeason(seasonKey);
        }

        function handleTagChange(tag) {
            currentTag = tag || 'all';
            applyFilters();
        }

        // Initialize gallery
        async function initGallery() {
            try {
                await loadGallerySeasons();
            } catch (err) {
                console.error(err);
                const loading = document.getElementById('gallery-loading');
                if (loading) {
                    loading.style.display = 'flex';
                    loading.textContent = 'Gallery failed to load (missing seasons JSON)';
                }
                return;
            }

            initSeasonSelector();
            currentTag = getInitialTag();
            setSeason(getInitialSeasonKey(), { pushHistory: false });
            
            // Add keyboard navigation
            document.addEventListener('keydown', handleKeyNavigation);
            
            // Add fullscreen change listener
            document.addEventListener('fullscreenchange', handleFullscreenChange);
        }

        // Update main image and info
        function updateDisplay() {
            if (!galleryConfig.images || galleryConfig.images.length === 0) {
                const galleryImage = document.getElementById('gallery-image');
                const loading = document.getElementById('gallery-loading');
                if (galleryImage) {
                    galleryImage.removeAttribute('src');
                    galleryImage.alt = '';
                }
                if (loading) {
                    loading.style.display = 'flex';
                    loading.textContent = 'No images match this tag.';
                }
                document.getElementById('image-title').textContent = '';
                document.getElementById('image-description').textContent = '';
                return;
            }

            const currentImage = galleryConfig.images[currentIndex];
            const galleryImage = document.getElementById('gallery-image');
            const loading = document.getElementById('gallery-loading');
            
            // Show loading
            loading.style.display = 'flex';
            loading.textContent = 'Loading...';
            
            // Create new image to preload
            const newImg = new Image();
            newImg.onload = function() {
                galleryImage.src = buildImageUrl(currentImage.file);
                galleryImage.alt = currentImage.title;
                loading.style.display = 'none';
                
                // Update image info
                document.getElementById('image-title').textContent = currentImage.title;
                document.getElementById('image-description').textContent = currentImage.description;
                document.getElementById('current-index').textContent = currentIndex + 1;
                
                // Update active thumbnail
                updateActiveThumbnail();
            };
            newImg.src = buildImageUrl(currentImage.file);
        }

        // Navigate to previous image
        function prevImage() {
            if (!galleryConfig.images || galleryConfig.images.length === 0) return;
            currentIndex = (currentIndex - 1 + galleryConfig.images.length) % galleryConfig.images.length;
            updateDisplay();
            resetAutoRotate();
        }

        // Navigate to next image
        function nextImage() {
            if (!galleryConfig.images || galleryConfig.images.length === 0) return;
            currentIndex = (currentIndex + 1) % galleryConfig.images.length;
            updateDisplay();
            resetAutoRotate();
        }

        // Jump to specific image
        function jumpToImage(index) {
            if (!galleryConfig.images || galleryConfig.images.length === 0) return;
            currentIndex = index;
            updateDisplay();
            resetAutoRotate();
        }

        // Pause/resume auto rotation
        function pauseGallery() {
            const pauseBtn = document.getElementById('pause-btn');
            const icon = pauseBtn.querySelector('i');
            
            if (isPaused) {
                startAutoRotate();
                isPaused = false;
                icon.className = 'fa fa-pause';
                pauseBtn.innerHTML = '<i class="fa fa-pause"></i> Pause';
            } else {
                stopAutoRotate();
                isPaused = true;
                icon.className = 'fa fa-play';
                pauseBtn.innerHTML = '<i class="fa fa-play"></i> Resume';
            }
        }

        // Auto rotation functions
        function startAutoRotate() {
            if (!isPaused) {
                autoRotateInterval = setInterval(() => {
                    nextImage();
                }, galleryConfig.autoRotateSpeed);
            }
        }

        function stopAutoRotate() {
            if (autoRotateInterval) {
                clearInterval(autoRotateInterval);
                autoRotateInterval = null;
            }
        }

        function resetAutoRotate() {
            if (!isPaused) {
                stopAutoRotate();
                startAutoRotate();
            }
        }

        // Fullscreen functionality
        function toggleFullscreen() {
            const container = document.querySelector('.gallery-image-container');
            
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    console.log('Fullscreen failed:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }

        function handleFullscreenChange() {
            isFullscreen = !!document.fullscreenElement;
            const container = document.querySelector('.gallery-image-container');
            container.classList.toggle('fullscreen-active', isFullscreen);
        }

        // Download current image
        function downloadImage() {
            const currentImage = galleryConfig.images[currentIndex];
            const link = document.createElement('a');
            link.href = buildImageUrl(currentImage.file);
            link.download = currentImage.file;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Create thumbnail grid
        function createThumbnails() {
            const container = document.getElementById('thumbnails-container');
            container.innerHTML = '';
            
            galleryConfig.images.forEach((image, index) => {
                const thumbContainer = document.createElement('div');
                thumbContainer.className = 'thumbnail-item';
                thumbContainer.onclick = () => jumpToImage(index);
                
                const thumb = document.createElement('img');
                thumb.src = buildImageUrl(image.file);
                thumb.alt = image.title;
                thumb.className = 'thumbnail-image';
                
                const title = document.createElement('div');
                title.className = 'thumbnail-title';
                title.textContent = image.title;
                
                thumbContainer.appendChild(thumb);
                thumbContainer.appendChild(title);
                container.appendChild(thumbContainer);
            });
        }

        // Update active thumbnail highlighting
        function updateActiveThumbnail() {
            const thumbnails = document.querySelectorAll('.thumbnail-item');
            thumbnails.forEach((thumb, index) => {
                thumb.classList.toggle('active', index === currentIndex);
            });
        }

        // Keyboard navigation
        function handleKeyNavigation(event) {
            switch(event.key) {
                case 'ArrowLeft':
                    prevImage();
                    break;
                case 'ArrowRight':
                    nextImage();
                    break;
                case ' ':
                    event.preventDefault();
                    pauseGallery();
                    break;
                case 'Escape':
                    if (document.fullscreenElement) {
                        document.exitFullscreen();
                    }
                    break;
            }
        }

        // Initialize when page loads
        window.addEventListener('load', initGallery);
        
        // Pause auto-rotation when page is not visible
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                stopAutoRotate();
            } else if (!isPaused) {
                startAutoRotate();
            }
        });
    </script>
    <footer class="copyright_div">
        <a href="https://github.com/FQQD/MCServer-Web-Template" class="copyright">Made by FQQD 2023 - Edited by Dakota -
            HeruEdhel 2025</a>
    </footer>
</body>

</html>
